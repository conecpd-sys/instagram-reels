<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  background: transparent;
}

.reels {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  width: 100%;
}

.reel {
  min-width: 0;
}

.reel blockquote {
  margin: 0 !important;
  width: 100% !important;
  min-width: 0 !important;
}

@media (max-width: 800px) {
  .reels {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>

<body>

<div class="reels">

  <div class="reel">
    <blockquote
      class="instagram-media"
      data-instgrm-permalink="https://www.instagram.com/reel/DHGF19mpnDM/"
      data-instgrm-version="14">
    </blockquote>
  </div>

  <div class="reel">

      class="instagram-media"
      data-instgrm-permalink="https://www.instagram.com/reel/DHGF19mpnDM/"

  </div>

  <div class="reel">

</div>

</html>
