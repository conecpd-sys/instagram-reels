<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Reels 4 Column</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: transparent;
  }

  .reels-row {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
    width: 100%;
    align-items: start;
  }

  .reel {
    min-width: 0;
    overflow: hidden;
  }

  .reel blockquote.instagram-media {
    margin: 0 !important;
    width: 100% !important;
    min-width: 0 !important;
  }

  @media (max-width: 800px) {
    .reels-row {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 480px) {
    .reels-row {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>

<div class="reels-row">

  <div class="reel">
    <blockquote class="instagram-media"
      data-instgrm-permalink="https://www.instagram.com/reels/DHGF19mpnDM/"
      data-instgrm-version="14">
    </blockquote>
  </div>

  <div class="reel">
    <blockquote class="instagram-media"
      data-instgrm-permalink="https://www.instagram.com/reels/DHGF19mpnDM/"
      data-instgrm-version="14">
    </blockquote>
  </div>

  <div class="reel">
    <blockquote class="instagram-media"
      data-instgrm-permalink="https://www.instagram.com/reels/DHGF19mpnDM/"
      data-instgrm-version="14">
    </blockquote>
  </div>

  <div class="reel">
    <blockquote class="instagram-media"
      data-instgrm-permalink="https://www.instagram.com/reels/DHGF19mpnDM/"
      data-instgrm-version="14">
    </blockquote>
  </div>

</div>

<script async src="https://www.instagram.com/embed.js"></script>

</body>
</html>
